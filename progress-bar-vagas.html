<!--
  Barra de Progresso de Vagas - Versão Compacta
  Componente HTML autossuficiente para GreatPages
-->

<!-- Importação da fonte Montserrat do Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

<style>
  /* ===== CONTAINER PRINCIPAL ===== */
  .progress-container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 8px 15px;
    box-sizing: border-box;
  }

  /* ===== FUNDO DA BARRA (container escuro) ===== */
  .progress-bar-bg {
    width: 100%;
    height: 38px;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
  }

  /* ===== EFEITO DE CARREGAMENTO NO FUNDO (listras finas inclinadas) ===== */
  .progress-bar-bg::before {
    content: '';
    position: absolute;
    top: 0;
    left: -50%;
    width: 200%;
    height: 100%;
    background: repeating-linear-gradient(
      -45deg,
      transparent 0px,
      transparent 8px,
      rgba(255, 255, 255, 0.08) 8px,
      rgba(255, 255, 255, 0.08) 12px
    );
    animation: loading-stripes 0.8s linear infinite;
    z-index: 0;
  }

  @keyframes loading-stripes {
    0% {
      transform: translateX(0);
    }
    100% {
      transform: translateX(28px);
    }
  }

  /* ===== BARRA DE PROGRESSO BRANCA ===== */
  .progress-bar-fill {
    height: 100%;
    background: #FFFFFF;
    border-radius: 12px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: width 0.5s ease-out;
    overflow: hidden;
    min-width: 180px;
    z-index: 2;
  }

  /* ===== TEXTO DA PORCENTAGEM (parte preenchida) ===== */
  .progress-text {
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #8B0000;
    white-space: nowrap;
    position: relative;
    z-index: 2;
  }

  /* ===== TEXTO DA PARTE VAZIA ===== */
  .remaining-text {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: #FFFFFF;
    white-space: normal;
    text-align: center;
    line-height: 1.3;
    max-width: 140px;
    z-index: 1;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    pointer-events: none;
  }

  /* ===== EFEITO SHINE (raio de luz branco) ===== */
  .progress-bar-fill::after {
    content: '';
    position: absolute;
    top: 0;
    left: -30%;
    width: 30%;
    height: 100%;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 255, 255, 0.4) 20%,
      rgba(255, 255, 255, 0.8) 50%,
      rgba(255, 255, 255, 0.4) 80%,
      transparent 100%
    );
    animation: shine 1.2s ease-in-out infinite;
    z-index: 3;
  }

  /* ===== ANIMAÇÃO KEYFRAMES DO SHINE ===== */
  @keyframes shine {
    0% {
      left: -30%;
    }
    100% {
      left: 100%;
    }
  }

  /* ===== RESPONSIVO PARA MOBILE ===== */
  @media (max-width: 500px) {
    .progress-text {
      font-size: 11px;
    }

    .remaining-text {
      font-size: 9px;
      max-width: 90px;
      line-height: 1.2;
    }

    .progress-bar-fill {
      min-width: 130px;
    }

    .progress-bar-bg {
      height: 36px;
    }
  }
</style>

<!-- ===== HTML DA BARRA DE PROGRESSO ===== -->
<div class="progress-container">
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill">
      <span class="progress-text" id="progressText">56% das vagas preenchidas</span>
    </div>
    <span class="remaining-text" id="remainingText">Restam apenas 12 vagas nesse valor</span>
  </div>
</div>

<script>
  (function() {
    // ===== CONFIGURAÇÕES =====
    const DATA_INICIO = new Date(2026, 0, 5);  // 05 de Janeiro de 2026
    const DATA_FINAL = new Date(2026, 0, 27, 19, 0, 0);  // 27 de Janeiro de 2026 às 19h
    const PORCENTAGEM_INICIAL = 56;
    const PORCENTAGEM_FINAL = 100;
    const INCREMENTO_DIARIO = 2;
    const VAGAS_INICIAL = 12;
    const VAGAS_FINAL = 1;

    // ===== FUNÇÃO PARA CALCULAR A PORCENTAGEM ATUAL =====
    function calcularPorcentagem() {
      const hoje = new Date();
      const hojeNormalizado = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
      const inicioNormalizado = new Date(DATA_INICIO.getFullYear(), DATA_INICIO.getMonth(), DATA_INICIO.getDate());
      const finalNormalizado = new Date(DATA_FINAL.getFullYear(), DATA_FINAL.getMonth(), DATA_FINAL.getDate());

      if (hojeNormalizado < inicioNormalizado) return PORCENTAGEM_INICIAL;
      if (hojeNormalizado >= finalNormalizado) return PORCENTAGEM_FINAL;

      const diferencaMs = hojeNormalizado - inicioNormalizado;
      const diasPassados = Math.floor(diferencaMs / (1000 * 60 * 60 * 24));
      return Math.min(PORCENTAGEM_INICIAL + (diasPassados * INCREMENTO_DIARIO), PORCENTAGEM_FINAL);
    }

    // ===== FUNÇÃO PARA CALCULAR VAGAS RESTANTES =====
    function calcularVagas() {
      const hoje = new Date();
      const inicioNormalizado = new Date(DATA_INICIO.getFullYear(), DATA_INICIO.getMonth(), DATA_INICIO.getDate());

      if (hoje < inicioNormalizado) return VAGAS_INICIAL;
      if (hoje >= DATA_FINAL) return VAGAS_FINAL;

      // Calcula o progresso total em milissegundos
      const totalMs = DATA_FINAL - inicioNormalizado;
      const passadoMs = hoje - inicioNormalizado;
      const progresso = Math.min(passadoMs / totalMs, 1);

      // Interpola de 12 para 1 vaga
      const vagasRestantes = Math.round(VAGAS_INICIAL - (progresso * (VAGAS_INICIAL - VAGAS_FINAL)));
      return Math.max(vagasRestantes, VAGAS_FINAL);
    }

    // ===== FUNÇÃO PARA ATUALIZAR A BARRA =====
    function atualizarBarra() {
      const porcentagem = calcularPorcentagem();
      const vagas = calcularVagas();
      const barraFill = document.getElementById('progressFill');
      const textoProgresso = document.getElementById('progressText');
      const textoRestante = document.getElementById('remainingText');

      if (barraFill && textoProgresso) {
        barraFill.style.width = porcentagem + '%';
        textoProgresso.textContent = porcentagem + '% das vagas preenchidas';
      }

      if (textoRestante) {
        // Atualiza o texto com o número de vagas
        const textoVaga = vagas === 1 ? 'vaga' : 'vagas';
        textoRestante.textContent = 'Restam apenas ' + vagas + ' ' + textoVaga + ' nesse valor';

        // Centraliza o texto na área não preenchida
        const areaPreenchida = porcentagem;
        const areaVazia = 100 - areaPreenchida;
        const centroAreaVazia = areaPreenchida + (areaVazia / 2);
        textoRestante.style.left = centroAreaVazia + '%';
      }
    }

    // ===== INICIALIZA =====
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', atualizarBarra);
    } else {
      atualizarBarra();
    }
  })();
</script>

<!--
  Barra de Progresso de Vagas - Versão Compacta
  Componente HTML autossuficiente para GreatPages
-->

<!-- Importação da fonte Montserrat do Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

<style>
  /* ===== CONTAINER PRINCIPAL ===== */
  .progress-container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 8px 15px;
    box-sizing: border-box;
  }

  /* ===== FUNDO DA BARRA (container escuro) ===== */
  .progress-bar-bg {
    width: 100%;
    height: 38px;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
  }

  /* ===== BARRA DE PROGRESSO BRANCA ===== */
  .progress-bar-fill {
    height: 100%;
    background: #FFFFFF;
    border-radius: 20px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: width 0.5s ease-out;
    overflow: hidden;
    min-width: 180px;
  }

  /* ===== TEXTO DA PORCENTAGEM (parte preenchida) ===== */
  .progress-text {
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #8B0000;
    white-space: nowrap;
    position: relative;
    z-index: 2;
  }

  /* ===== TEXTO DA PARTE VAZIA ===== */
  .remaining-text {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: #FFFFFF;
    white-space: nowrap;
    z-index: 1;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
  }

  /* ===== EFEITO SHINE (brilho animado) ===== */
  .progress-bar-fill::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 255, 255, 0.6) 50%,
      transparent 100%
    );
    animation: shine 2.5s ease-in-out infinite;
    z-index: 1;
  }

  /* ===== ANIMAÇÃO KEYFRAMES DO SHINE ===== */
  @keyframes shine {
    0% {
      left: -100%;
    }
    30% {
      left: 100%;
    }
    100% {
      left: 100%;
    }
  }

  /* ===== RESPONSIVO PARA MOBILE ===== */
  @media (max-width: 500px) {
    .progress-bar-bg {
      height: 34px;
    }

    .progress-text {
      font-size: 12px;
    }

    .remaining-text {
      font-size: 10px;
      right: 10px;
    }

    .progress-bar-fill {
      min-width: 140px;
    }
  }
</style>

<!-- ===== HTML DA BARRA DE PROGRESSO ===== -->
<div class="progress-container">
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill">
      <span class="progress-text" id="progressText">56% das vagas preenchidas</span>
    </div>
    <span class="remaining-text" id="remainingText">Restam apenas 12 vagas nesse valor</span>
  </div>
</div>

<script>
  (function() {
    // ===== CONFIGURAÇÕES =====
    const DATA_INICIO = new Date(2026, 0, 5);  // 05 de Janeiro de 2026
    const DATA_FINAL = new Date(2026, 0, 27);  // 27 de Janeiro de 2026
    const PORCENTAGEM_INICIAL = 56;            // Valor inicial em 05/01
    const PORCENTAGEM_FINAL = 100;             // Valor final em 27/01
    const INCREMENTO_DIARIO = 2;               // 2% ao dia

    // ===== FUNÇÃO PARA CALCULAR A PORCENTAGEM ATUAL =====
    function calcularPorcentagem() {
      const hoje = new Date();

      // Normaliza as datas para comparar apenas dia/mês/ano (ignora horas)
      const hojeNormalizado = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
      const inicioNormalizado = new Date(DATA_INICIO.getFullYear(), DATA_INICIO.getMonth(), DATA_INICIO.getDate());
      const finalNormalizado = new Date(DATA_FINAL.getFullYear(), DATA_FINAL.getMonth(), DATA_FINAL.getDate());

      // Se for antes da data de início, retorna 56%
      if (hojeNormalizado < inicioNormalizado) {
        return PORCENTAGEM_INICIAL;
      }

      // Se for na data final ou depois, retorna 100%
      if (hojeNormalizado >= finalNormalizado) {
        return PORCENTAGEM_FINAL;
      }

      // Calcula a diferença em dias desde o início
      const diferencaMs = hojeNormalizado - inicioNormalizado;
      const diasPassados = Math.floor(diferencaMs / (1000 * 60 * 60 * 24));

      // Calcula a porcentagem atual
      let porcentagemAtual = PORCENTAGEM_INICIAL + (diasPassados * INCREMENTO_DIARIO);

      // Garante que nunca ultrapasse 100%
      return Math.min(porcentagemAtual, PORCENTAGEM_FINAL);
    }

    // ===== FUNÇÃO PARA ATUALIZAR A BARRA =====
    function atualizarBarra() {
      const porcentagem = calcularPorcentagem();
      const barraFill = document.getElementById('progressFill');
      const textoProgresso = document.getElementById('progressText');

      if (barraFill && textoProgresso) {
        barraFill.style.width = porcentagem + '%';
        textoProgresso.textContent = porcentagem + '% das vagas preenchidas';
      }
    }

    // ===== INICIALIZA A BARRA QUANDO O DOM ESTIVER PRONTO =====
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', atualizarBarra);
    } else {
      atualizarBarra();
    }
  })();
</script>

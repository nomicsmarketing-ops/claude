<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrossel Infinito</title>
  <style>
    /* ========================================
       CARROSSEL INFINITO - CSS
       Copie este código para o seu site
    ======================================== */

    .carousel-wrapper {
      overflow: hidden;
      width: 100%;
      position: relative;
    }

    .carousel-track {
      display: flex;
      animation: scroll-infinite 20s linear infinite;
      width: max-content;
    }

    .carousel-track:hover {
      animation-play-state: paused;
    }

    .carousel-item {
      flex-shrink: 0;
      padding: 0 15px;
    }

    .carousel-item img {
      max-width: 200px;
      height: auto;
      display: block;
    }

    @keyframes scroll-infinite {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }

    /* Fade nas bordas (opcional) */
    .carousel-wrapper::before,
    .carousel-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50px;
      z-index: 2;
      pointer-events: none;
    }

    .carousel-wrapper::before {
      left: 0;
      background: linear-gradient(to right, rgba(255,255,255,1), rgba(255,255,255,0));
    }

    .carousel-wrapper::after {
      right: 0;
      background: linear-gradient(to left, rgba(255,255,255,1), rgba(255,255,255,0));
    }

    /* Para remover o fade, delete as regras acima de ::before e ::after */
  </style>
</head>
<body>

<!-- ========================================
     CÓDIGO PARA INJETAR NA PLATAFORMA
     Cole este script no seu site/plataforma
======================================== -->

<script>
(function() {
  // Classes dos elementos de imagem que devem rodar no carrossel
  const imageClasses = [
    '.e_3452936_1_176606894637703064',
    '.e_3452936_1_176607451724007308',
    '.e_3452936_1_176607451169682368',
    '.e_3452936_1_176607452198884158',
    '.e_3452936_1_176607453708860861'
  ];

  // Configurações do carrossel
  const CONFIG = {
    speed: 20,           // Segundos para completar um ciclo (menor = mais rápido)
    direction: 'left',   // 'left' ou 'right'
    pauseOnHover: true,  // Pausar ao passar o mouse
    gap: 30,             // Espaço entre imagens em pixels
    fadeEdges: true,     // Adicionar fade nas bordas
    fadeColor: '255,255,255' // Cor do fade em RGB (branco = 255,255,255)
  };

  function initCarousel() {
    // Encontrar todos os elementos
    const elements = [];
    imageClasses.forEach(selector => {
      const el = document.querySelector(selector);
      if (el) {
        elements.push(el);
      }
    });

    if (elements.length === 0) {
      console.warn('Carrossel: Nenhum elemento encontrado com as classes especificadas');
      return;
    }

    // Encontrar o container pai comum
    const parentContainer = elements[0].parentElement;

    // Criar estrutura do carrossel
    const wrapper = document.createElement('div');
    wrapper.className = 'carousel-infinite-wrapper';

    const track = document.createElement('div');
    track.className = 'carousel-infinite-track';

    // Mover elementos para o track
    elements.forEach(el => {
      const item = document.createElement('div');
      item.className = 'carousel-infinite-item';
      item.appendChild(el.cloneNode(true));
      track.appendChild(item);
    });

    // Duplicar elementos para criar efeito infinito
    elements.forEach(el => {
      const item = document.createElement('div');
      item.className = 'carousel-infinite-item';
      item.appendChild(el.cloneNode(true));
      track.appendChild(item);
    });

    // Remover elementos originais
    elements.forEach(el => el.remove());

    // Montar carrossel
    wrapper.appendChild(track);
    parentContainer.appendChild(wrapper);

    // Injetar estilos
    const styles = document.createElement('style');
    styles.textContent = `
      .carousel-infinite-wrapper {
        overflow: hidden;
        width: 100%;
        position: relative;
      }

      .carousel-infinite-track {
        display: flex;
        animation: carousel-scroll ${CONFIG.speed}s linear infinite;
        width: max-content;
        gap: ${CONFIG.gap}px;
      }

      ${CONFIG.pauseOnHover ? `
      .carousel-infinite-track:hover {
        animation-play-state: paused;
      }
      ` : ''}

      .carousel-infinite-item {
        flex-shrink: 0;
      }

      .carousel-infinite-item img {
        display: block;
        max-width: 100%;
        height: auto;
      }

      @keyframes carousel-scroll {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(${CONFIG.direction === 'left' ? '-50%' : '50%'});
        }
      }

      ${CONFIG.fadeEdges ? `
      .carousel-infinite-wrapper::before,
      .carousel-infinite-wrapper::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: 80px;
        z-index: 2;
        pointer-events: none;
      }

      .carousel-infinite-wrapper::before {
        left: 0;
        background: linear-gradient(to right, rgba(${CONFIG.fadeColor},1), rgba(${CONFIG.fadeColor},0));
      }

      .carousel-infinite-wrapper::after {
        right: 0;
        background: linear-gradient(to left, rgba(${CONFIG.fadeColor},1), rgba(${CONFIG.fadeColor},0));
      }
      ` : ''}
    `;
    document.head.appendChild(styles);

    console.log('Carrossel infinito inicializado com sucesso!');
  }

  // Aguardar DOM carregar
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCarousel);
  } else {
    initCarousel();
  }
})();
</script>
